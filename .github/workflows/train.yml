name: PacketLM Train

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packetlm/**'
      - '.github/workflows/train.yml'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Language-phase with hard gate
        run: python -m packetlm.train
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-language-receipt
          path: artifacts/receipt.json
