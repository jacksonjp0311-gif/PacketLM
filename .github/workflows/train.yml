name: PacketLM Train

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packetlm/**'
      - '.github/workflows/train.yml'
      - 'data/weights.json'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tiny next-token model
        run: python -m packetlm.tiny
      - name: Upload tiny receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-tiny-receipt
          path: artifacts/tiny_receipt.json
      - name: Commit persisted weights
        if: always()
        run: |
          git config user.name "packetlm"
          git config user.email "packetlm@users.noreply.github.com"
          git add data/weights.json || true
          git diff --cached --quiet || git commit -m "Persist weights from runner"
          git push || true
      - name: Intelligence probe
        if: always()
        run: python -m packetlm.iq
      - name: Upload iq receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-iq-receipt
          path: artifacts/iq_receipt.json
      - name: Embed probe targets
        if: always()
        run: python -m packetlm.embed
      - name: Upload embed receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-embed-receipt
          path: artifacts/embed_receipt.json
      - name: Held-out probe
        if: always()
        run: python -m packetlm.transfer_probe
      - name: Upload held-out probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-transfer-probe-receipt
          path: artifacts/transfer_probe_receipt.json
      - name: Self-edit
        if: always()
        run: python -m packetlm.selfedit
      - name: Upload self-edit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-selfedit-receipt
          path: artifacts/selfedit_receipt.json
