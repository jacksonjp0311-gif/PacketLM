name: PacketLM Train

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packetlm/**'
      - '.github/workflows/train.yml'
      - 'data/**'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System
        run: python -m packetlm.system
      - name: Upload system receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-system-receipt
          path: artifacts/system_receipt.json
