name: PacketLM Train

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packetlm/**'
      - '.github/workflows/train.yml'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Language-phase measurement
        run: python -m packetlm.train
      - name: Upload training receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-language-receipt
          path: artifacts/receipt.json
      - name: Receipted continuation demo
        if: always()
        run: python -m packetlm.demo
      - name: Upload demo receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-demo-receipt
          path: artifacts/demo_receipt.json
      - name: Strength update
        if: always()
        run: python -m packetlm.improve
      - name: Upload improve receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-improve-receipt
          path: artifacts/improve_receipt.json
