name: PacketLM Train

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packetlm/**'
      - '.github/workflows/train.yml'
      - 'data/**'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Field geometry
        run: python -m packetlm.geometry
      - name: Upload geometry receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-geometry-receipt
          path: artifacts/geometry_receipt.json
      - name: Speak from route
        if: always()
        run: python -m packetlm.speak
      - name: Upload speak receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-speak-receipt
          path: artifacts/speak_receipt.json
      - name: Commit field and memory
        if: always()
        run: |
          git config user.name "packetlm"
          git config user.email "packetlm@users.noreply.github.com"
          git add data/context_packets.json data/mind_memory.json || true
          git diff --cached --quiet || git commit -m "Persist field and memory"
          git push || true
      - name: Tiny next-token model
        if: always()
        run: python -m packetlm.tiny
      - name: Upload tiny receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-tiny-receipt
          path: artifacts/tiny_receipt.json
