name: PacketLM Train

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packetlm/**'
      - '.github/workflows/train.yml'
      - 'data/**'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Role binding
        run: python -m packetlm.bind
      - name: Upload bind receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-bind-receipt
          path: artifacts/bind_receipt.json
      - name: Field geometry
        if: always()
        run: python -m packetlm.geometry
      - name: Upload geometry receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-geometry-receipt
          path: artifacts/geometry_receipt.json
      - name: Speak from route
        if: always()
        run: python -m packetlm.speak
      - name: Upload speak receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-speak-receipt
          path: artifacts/speak_receipt.json
      - name: Tiny next-token model
        if: always()
        run: python -m packetlm.tiny
      - name: Upload tiny receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-tiny-receipt
          path: artifacts/tiny_receipt.json
