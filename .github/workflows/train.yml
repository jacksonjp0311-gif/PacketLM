name: PacketLM Train

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packetlm/**'
      - '.github/workflows/train.yml'
      - 'data/**'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Field mind
        run: python -m packetlm.mind
      - name: Upload mind receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-mind-receipt
          path: artifacts/mind_receipt.json
      - name: Context packets
        if: always()
        run: python -m packetlm.context
      - name: Upload context receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-context-receipt
          path: artifacts/context_receipt.json
      - name: Commit field
        if: always()
        run: |
          git config user.name "packetlm"
          git config user.email "packetlm@users.noreply.github.com"
          git add data/context_packets.json || true
          git diff --cached --quiet || git commit -m "Persist field from runner"
          git push || true
      - name: Tiny next-token model
        if: always()
        run: python -m packetlm.tiny
      - name: Upload tiny receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-tiny-receipt
          path: artifacts/tiny_receipt.json
      - name: Intelligence probe
        if: always()
        run: python -m packetlm.iq
      - name: Upload iq receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-iq-receipt
          path: artifacts/iq_receipt.json
      - name: Self-edit
        if: always()
        run: python -m packetlm.selfedit
      - name: Upload self-edit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-selfedit-receipt
          path: artifacts/selfedit_receipt.json
      - name: Language-phase measurement
        if: always()
        run: python -m packetlm.train
      - name: Upload training receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-language-receipt
          path: artifacts/receipt.json
      - name: Multi-token generation
        if: always()
        run: python -m packetlm.generate
      - name: Upload generate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packetlm-generate-receipt
          path: artifacts/generate_receipt.json
